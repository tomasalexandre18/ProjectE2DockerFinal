services:
  django-soft:
    build: django-soft-1766014025
    image: sgttabasco/django-soft:latest
    environment:
      - APP_DOMAIN=*

  fastapi-stripe:
    build: ecommerce-fastapi-stripe
    image: sgttabasco/fastapi-stripe:latest

  flask-black:
    build: flask-black-dashboard
    image: sgttabasco/flask-black:latest
    ports:
      - "5000:5005"

  nginx:
    image: nginx:alpine-slim
    ports:
      - "5001:5001"
      - "5002:5002"
      - "5003:5003"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./html5up/massively:/usr/share/nginx/html
    depends_on:
      - django-soft
      - fastapi-stripe
      - flask-black

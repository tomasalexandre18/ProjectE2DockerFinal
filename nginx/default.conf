# Server for HTML5UP (Static Site)
server {
    listen       5001;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }
}

# Server for Django Soft UI
server {
    listen       5002;

    location / {
        proxy_pass http://django-soft:5005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Server for Ecommerce FastAPI Stripe
server {
    listen       5003;

    location / {
        proxy_pass http://fastapi-stripe:5085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}